name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Create Release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true
      - name: Create Release
        id: semrel
        uses: go-semantic-release/action@v1
        with:
          hooks: goreleaser
          changelog-file: CHANGELOG.md
          allow-initial-development-versions: true
          prepend: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Manifest version sync is performed manually by maintainers before tagging:
      #   bash scripts/bump-version.sh <next-version>
      #   git commit -am "chore(release): bump manifests to vN.M.P"
      # An auto-sync step here would need a PAT secret to bypass the ruleset on
      # main — see CONTRIBUTING.md for the rationale. Repos that move to a
      # GitHub org can add a github-actions Integration bypass and re-enable
      # automatic sync.
