service:
  port: "SERVICEPORT"

server:
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s

request:
  max_body_size: 10485760  # 10 MiB

cors:
  allowed_origins: ["*"]
  allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allowed_headers: ["*"]
  exposed_headers: []
  allow_credentials: false
  max_age: 300

auth:
  enabled: true
  config:
    oauth_provider_url: ""
    oauth_audience: []
    allowed_clock_skew: 5s
    claims:
      tenant_id: tenant_id
      email: email
      roles: roles
      groups: groups

health:
  storage: true
  dependencies: []

observability:
  tracing:
    enabled: true
    otlp_endpoint: "localhost:4317"
    otlp_insecure: true

storage:
  type: sql
  config:
    provider: postgresql
    host: localhost
    port: "5432"
    user: postgres
    password: admin
    dbname: SERVICENAME
    schema: SERVICESCHEMA
